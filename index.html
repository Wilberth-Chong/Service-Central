<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ffffff" />
    <title>Services Central</title>
    <link rel="stylesheet" href="styles.css?v=20260810-figma-dashboard" />
  </head>
  <body>
    <main id="app" aria-live="polite"></main>

    <template id="sign-in-template">
      <section class="screen screen--signin" aria-label="Services Central sign in">
        <div class="prototype-canvas prototype-canvas--signin">
          <img
            class="prototype-image"
            src="assets/sign-in.png"
            alt=""
            width="1440"
            height="1090"
            draggable="false"
          />

          <form class="signin-form" data-signin-form>
            <label class="sr-only" for="username">Username</label>
            <input
              id="username"
              name="username"
              type="email"
              autocomplete="username"
              placeholder="name.lastname@email.com"
              aria-label="Username"
            />
            <button type="submit">Next</button>
          </form>

          <button class="signin-help hotspot" type="button" data-help>
            <span class="sr-only">Having trouble signing in?</span>
          </button>
        </div>
      </section>
    </template>

    <template id="dashboard-template">
      <section class="screen screen--dashboard" aria-label="Services Central Dashboard">
        <div class="dashboard-toolbar">
          <button type="button" data-back-to-signin>Back to sign in</button>
          <span>Services Central prototype</span>
          <button type="button" data-open-flows>All flows</button>
        </div>

        <div class="prototype-canvas prototype-canvas--dashboard">
          <img
            class="prototype-image"
            src="assets/dashboard.png"
            alt="Services Central Dashboard showing access requests, service shortcuts, support tickets, and favorite instruments"
            width="1440"
            height="2537"
            draggable="false"
          />

          <nav class="dashboard-hotspots" aria-label="Prototype interactions">
            <button class="hotspot nav-hotspot nav-dashboard" data-route="dashboard" aria-label="Dashboard"></button>
            <button class="hotspot nav-hotspot nav-instruments" data-route="my-instruments" aria-label="My instruments"></button>
            <button class="hotspot nav-hotspot nav-add" data-route="add-instruments" aria-label="Add instruments"></button>
            <button class="hotspot nav-hotspot nav-installation" data-route="installations" aria-label="Installations"></button>
            <button class="hotspot nav-hotspot nav-support" data-route="support-history" aria-label="Support history"></button>
            <button class="hotspot nav-hotspot nav-contacts" data-route="service-plan-contacts" aria-label="Service plan contacts"></button>
            <button class="hotspot nav-hotspot nav-consumables" data-route="consumables" aria-label="Consumables"></button>
            <button class="hotspot nav-hotspot nav-settings" data-route="notifications" aria-label="Settings"></button>
            <button class="hotspot nav-hotspot nav-notifications" data-open-services-help aria-label="Get help"></button>
          </nav>

          <button class="hotspot start-request" data-route="request-support" aria-label="Start a request"></button>
          <button class="hotspot go-pending" data-route="approval-email" aria-label="Go to pending access requests"></button>
          <button class="hotspot dashboard-search" data-route="my-instruments" aria-label="Search instruments, groups and tickets"></button>
          <button class="hotspot tile tile-consumables" data-route="consumables" aria-label="Order consumables"></button>
          <button class="hotspot tile tile-education" data-route="education" aria-label="Browse education"></button>
          <button class="hotspot tile tile-plan" data-route="service-plan-approval" aria-label="Request service plan"></button>
          <button class="hotspot tile tile-maintenance" data-route="request-support" aria-label="Request maintenance or support"></button>
          <button class="hotspot ticket-history" data-route="support-history" aria-label="View support request history"></button>
          <button class="hotspot view-instruments" data-route="my-instruments" aria-label="View all my instruments"></button>
        </div>
      </section>
    </template>

    <template id="dashboard-native-template">
      <section class="screen screen--dashboard" aria-label="Services Central Dashboard">
        <div class="flow-toolbar">
          <button type="button" data-back-to-signin>Back</button>
          <strong>Services Central Dashboard</strong>
          <div class="flow-toolbar__actions">
            <button type="button" data-route="dashboard">Dashboard</button>
            <button type="button" data-open-flows>All flows</button>
          </div>
        </div>
        <div class="native-dashboard">
        <header class="native-dashboard__header komodo-platform-header">
          <button class="native-dashboard__menu" type="button" aria-label="Open menu"><span></span><span></span><span></span></button>
          <div class="native-dashboard__brand"><strong>ThermoFisher</strong><small>SCIENTIFIC</small></div>
          <span class="native-dashboard__platform">Connect Platform</span>
          <b>Services Central</b>
          <div class="native-dashboard__header-actions"><button class="native-dashboard__bell" type="button" aria-label="Notifications">2</button><button class="native-dashboard__profile" type="button" aria-label="Profile"></button></div>
        </header>
        <aside class="native-dashboard__nav komodo-platform-navigation" aria-label="Dashboard navigation">
          <button class="is-current" data-route="dashboard" aria-current="page" aria-label="Dashboard"><span class="nav-glyph nav-glyph--dashboard"></span></button>
          <button data-route="my-instruments" aria-label="My instruments"><span class="nav-glyph nav-glyph--instrument"></span></button>
          <button data-route="add-instruments" aria-label="Add instruments"><span class="nav-glyph nav-glyph--add"></span></button>
          <button data-route="installations" aria-label="Installations"><span class="nav-glyph nav-glyph--box"></span></button>
          <button data-route="support-history" aria-label="Support history"><span class="nav-glyph nav-glyph--tools"></span></button>
          <button data-route="service-plan-contacts" aria-label="Service plan contacts"><span class="nav-glyph nav-glyph--contacts"></span></button>
          <button data-route="consumables" aria-label="Consumables"><span class="nav-glyph nav-glyph--cart"></span></button>
          <button data-route="notifications" aria-label="Settings"><span class="nav-glyph nav-glyph--settings"></span></button>
          <button data-open-services-help aria-label="Get help"><span class="nav-glyph nav-glyph--help">?</span></button>
        </aside>
        <main class="native-dashboard__main">
          <div class="native-dashboard__titlebar komodo-page-header"><h1>Services Central Dashboard</h1><button class="native-dashboard__request komodo-button komodo-button--primary" data-route="request-support">Start a request</button></div>
          <section class="native-dashboard__notice komodo-banner" aria-label="Instrument access request notification"><button class="notice-arrow" type="button" aria-label="Previous notice">‹</button><div class="notice-icon" aria-hidden="true"><i></i><i></i><b>+</b></div><div><strong>3 instrument(s) access requests awaiting your approval</strong><p>Review the instrument(s) and approve or deny.</p></div><button class="native-dashboard__pending komodo-button komodo-button--outline" data-route="approval-email">Go to pending</button><button class="notice-arrow" type="button" aria-label="Next notice">›</button><div class="notice-dots" aria-hidden="true"><i></i><i></i><i></i></div></section>
          <label class="native-dashboard__search komodo-search-filters"><span class="sr-only">Search for instruments, groups and tickets</span><input data-dashboard-search type="search" placeholder="Search for instruments, groups and tickets" /><b aria-hidden="true"></b></label>
          <section class="native-dashboard__shortcuts" aria-label="Quick actions"><button data-route="consumables"><span class="quick-icon quick-icon--cart"></span><strong>Order<br>consumables</strong></button><button data-route="education"><span class="quick-icon quick-icon--education"></span><strong>Browse<br>education</strong></button><button data-route="service-plan-approval"><span class="quick-icon quick-icon--plan"></span><strong>Request<br>service plan</strong></button><button data-route="request-support"><span class="quick-icon quick-icon--tools"></span><strong>Request<br>maintenance<br>or support</strong></button></section>
          <section class="native-dashboard__promo"><button class="promo-arrow" type="button" aria-label="Previous promotion">‹</button><div><h2>Save 35% on your next <strong>reversed phase column</strong></h2><p><b>Save now on your next C18, phenyl or other reversed phase column.</b></p><small>Promo expires 29 Mar 2024. Applicable for online orders on analytical columns.</small><label><input type="checkbox"> Don't show this again</label></div><div class="promo-code"><b>Promo code: <a href="#consumables">XXX35</a></b><p>Promo code must be applied<br>at checkout</p></div><button class="native-dashboard__order" data-route="consumables">Order consumables</button><button class="promo-arrow" type="button" aria-label="Next promotion">›</button></section>
          <section class="native-dashboard__tickets"><div class="native-dashboard__section-title"><h2>Support request tickets</h2><button data-route="support-history">Support request history</button></div><div class="native-dashboard__divider"></div><div class="native-dashboard__tabs komodo-tabs" role="tablist"><button class="is-active" role="tab" aria-selected="true" data-ticket-state="active">Active tickets</button><button role="tab" aria-selected="false" data-ticket-state="closed">Recently closed tickets <em>2</em></button><button role="tab" aria-selected="false" data-ticket-state="visits">Upcoming on-site visits <em>3</em></button></div><div class="native-dashboard__ticket-bar"><h3 data-ticket-count>16 active tickets</h3><label>Filter by: <select aria-label="Filter tickets"><option>All status</option></select></label></div><div class="native-dashboard__table-wrap"><table class="komodo-data-table"><thead><tr><th>Status</th><th>Ticket no.</th><th>Created</th><th>Subject</th><th>Serial no.</th><th>Model no.</th></tr></thead><tbody>
            <tr><td><span class="ticket-status ticket-status--open">Open</span></td><td><a href="#ticket-detail">19602494</a></td><td>20 Jul 2024</td><td>Need support for unknown instrument error</td><td><span class="instrument-thumb"></span><a href="#my-instruments">1009996</a></td><td>VQF0000DET</td></tr>
            <tr><td><span class="ticket-status ticket-status--open">Open</span></td><td><a href="#ticket-detail">12670950</a></td><td>18 Jul 2024</td><td>Need support for unknown instrument error</td><td><span class="instrument-thumb instrument-thumb--tall"></span><a href="#my-instruments">1009999</a></td><td>VQH0000VEN</td></tr>
            <tr><td><span class="ticket-status ticket-status--open">Open</span></td><td><a href="#ticket-detail">12861716</a></td><td>25 May 2024</td><td>Need support for unknown instrument error</td><td><span class="instrument-thumb instrument-thumb--wide"></span><a href="#my-instruments">1009998</a></td><td>VQF00SAMPL</td></tr>
            <tr><td><span class="ticket-status ticket-status--progress">In progress</span></td><td><a href="#ticket-detail">15429289</a></td><td>7 May 2024</td><td>Repair 0000123459 instrument parts</td><td><span class="instrument-thumb instrument-thumb--wide"></span><a href="#my-instruments">1009997</a></td><td>VQF000PUMP</td></tr>
            <tr><td><span class="ticket-status ticket-status--progress">In progress</span></td><td><a href="#ticket-detail">15907622</a></td><td>30 Apr 2024</td><td>Repair 0000123459 instrument parts</td><td><span class="instrument-thumb"></span><a href="#my-instruments">TSQ-Z-12345</a></td><td>MSTSQQUANTISPLUS</td></tr>
            <tr><td><span class="ticket-status ticket-status--progress">In progress</span></td><td><a href="#ticket-detail">14440778</a></td><td>24 Apr 2024</td><td>Need support for unknown instrument error</td><td><span class="instrument-thumb"></span><a href="#my-instruments">TSQ-Z-12346</a></td><td>MSTSQQUANTISPLUS</td></tr>
            <tr><td><span class="ticket-status ticket-status--progress">In progress</span></td><td><a href="#ticket-detail">16144558</a></td><td>12 Apr 2024</td><td>Need support for unknown instrument error</td><td><span class="instrument-thumb"></span><a href="#my-instruments">TSQ-Z-12347</a></td><td>MSTSQQUANTISPLUS</td></tr>
            <tr><td><span class="ticket-status ticket-status--progress">In progress</span></td><td><a href="#ticket-detail">17595437</a></td><td>11 Mar 2024</td><td>Need support for unknown instrument error</td><td><span class="instrument-thumb"></span><a href="#my-instruments">TSQ-Z-12348</a></td><td>MSTSQQUANTISPLUS</td></tr>
            <tr><td><span class="ticket-status ticket-status--progress">In progress</span></td><td><a href="#ticket-detail">12211704</a></td><td>10 Mar 2024</td><td>Need support for unknown instrument error</td><td><span class="instrument-thumb"></span><a href="#my-instruments">SN98355W</a></td><td>QEXAC00001</td></tr>
            <tr><td><span class="ticket-status ticket-status--progress">In progress</span></td><td><a href="#ticket-detail">11800931</a></td><td>6 Jan 2024</td><td>Need calibration</td><td><span class="instrument-thumb"></span><a href="#my-instruments">SN98356W</a></td><td>QEXAC00001</td></tr>
          </tbody></table></div><div class="native-dashboard__pagination"><button disabled>‹</button><button class="is-current">1</button><button>2</button><button>›</button></div></section>
          <section class="native-dashboard__favourites"><div class="native-dashboard__section-title"><h2>My favorite instruments</h2><button data-route="my-instruments">View all my instruments</button></div><div class="native-dashboard__divider"></div><div class="instrument-cards"><article class="instrument-card instrument-card--summary"><span class="instrument-card__tag">LC/MS</span><h3>Alpine</h3><dl><dt>Components</dt><dd>total components</dd><dt>Groups</dt><dd>Department of Medical...</dd><dt>Tickets</dt><dd>16 total support tickets</dd></dl><footer>⌁ <button aria-label="More options">•••</button></footer></article><article class="instrument-card"><div class="instrument-card__machine"></div><p>Serial no.</p><h3>TSQ-Z-12346</h3><small>Triple Quadrupole LC-MS</small><dl><dt>Nickname</dt><dd>TSQ-0</dd><dt>Model no.</dt><dd>MSTSQQUANTISPLUS</dd><dt>Type</dt><dd>LC</dd><dt>Groups</dt><dd>—</dd></dl><span class="coverage">Under contract</span><footer><button data-route="request-support">⌁&nbsp; Request support</button><button aria-label="More options">•••</button></footer></article><article class="instrument-card"><div class="instrument-card__machine"></div><p>Serial no.</p><h3>TSQ-Z-12347</h3><small>Triple Quadrupole LC-MS</small><dl><dt>Nickname</dt><dd>TSQ-1</dd><dt>Model no.</dt><dd>MSTSQQUANTISPLUS</dd><dt>Type</dt><dd>Cold Chromatograph</dd><dt>Groups</dt><dd>—</dd></dl><span class="coverage">Under contract</span><footer><button data-route="request-support">⌁&nbsp; Request support</button><button aria-label="More options">•••</button></footer></article><article class="instrument-card"><div class="instrument-card__machine"></div><p>Serial no.</p><h3>TSQ-Z-12348</h3><small>Triple Quadrupole LC-MS</small><dl><dt>Nickname</dt><dd>TSQ-2</dd><dt>Model no.</dt><dd>MSTSQQUANTISPLUS</dd><dt>Type</dt><dd>Mass Spec Life Science</dd><dt>Groups</dt><dd>—</dd></dl><span class="coverage">Under contract</span><footer><button data-route="request-support">⌁&nbsp; Request support</button><button aria-label="More options">•••</button></footer></article></div></section>
        </main>
        <footer class="native-dashboard__footer">© 2025 - Thermo Fisher Scientific <a href="#privacy">Privacy policy</a><a href="#terms">Terms of use</a></footer>
        </div>
      </section>
    </template>

    <template id="flow-template">
      <section class="screen screen--flow" aria-label="Prototype flow screen">
        <div class="flow-toolbar">
          <button type="button" data-go-back>Back</button>
          <strong data-flow-title></strong>
          <div class="flow-toolbar__actions">
            <button type="button" data-route="dashboard">Dashboard</button>
            <button type="button" data-open-flows>All flows</button>
          </div>
        </div>
        <div class="flow-stage">
          <div class="flow-canvas" data-flow-canvas>
            <img class="flow-image" data-flow-image alt="" draggable="false" />
          </div>
        </div>
      </section>
    </template>

    <dialog id="help-dialog" class="help-dialog">
      <button class="dialog-close" type="button" data-close-dialog aria-label="Close">×</button>
      <h2>Having trouble signing in?</h2>
      <p>Use your Thermo Fisher Scientific account email address. For additional help, contact Services Central Support.</p>
      <button class="secondary-button" type="button" data-close-dialog>Close</button>
    </dialog>

    <dialog id="flows-dialog" class="flows-dialog">
      <button class="dialog-close" type="button" data-close-flows aria-label="Close flows">×</button>
      <h2>Prototype flows</h2>
      <p>Open a workflow or regional starting point.</p>
      <div class="flows-grid" data-flows-grid></div>
    </dialog>

    <dialog id="services-help-dialog" class="services-help-dialog" aria-label="Get help with Services Central">
      <div class="services-help-canvas">
        <img
          src="assets/flows/get-help-modal.png"
          alt="Get help with Services Central: Contact us, Online help, and Tours"
          width="953"
          height="499"
          draggable="false"
        />
        <button class="hotspot services-help-close" type="button" data-close-services-help aria-label="Close get help"></button>
        <button class="hotspot services-help-email" type="button" aria-label="Email Services Central support"></button>
        <a
          class="hotspot services-help-guide"
          href="https://apps.thermofisher.com/apps/csc/assets/services-central-help/GUID-55B094A3-8F4D-4DB6-9260-6D7B2F4301B2.html"
          target="_blank"
          rel="noreferrer"
          aria-label="Read help guide"
        ></a>
        <button class="hotspot services-help-tours" type="button" aria-label="See tours"></button>
      </div>
    </dialog>

    <div class="toast" role="status" aria-live="polite" aria-atomic="true" hidden></div>
    <script src="app.js?v=20260810-figma-dashboard"></script>
  </body>
</html>
